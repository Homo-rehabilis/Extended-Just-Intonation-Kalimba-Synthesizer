<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Extended Just Intonation Kalimba Synthesizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #090a0f;
      color: #f3f4f6;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 12px;
      overflow-x: hidden;
    }
    
    .app-card {
      background-color: #12141c;
      border: 1px solid #1f2433;
      border-radius: 20px;
      padding: 16px;
      width: 100%;
      max-width: 540px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.9);
      transition: max-width 0.3s ease, padding 0.3s ease;
      display: flex;
      flex-direction: column;
    }

    /* Fullscreen Mode */
    .app-card:fullscreen, .app-card:-webkit-full-screen {
      width: 100vw !important;
      height: 100vh !important;
      max-width: 100vw !important;
      max-height: 100vh !important;
      border-radius: 0 !important;
      border: none !important;
      padding: 10px 16px !important;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden !important;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
      flex-shrink: 0;
    }
    .title-group h1 {
      font-size: 1.05rem;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
    }
    .title-group p {
      font-size: 0.7rem;
      color: #8b92a5;
      margin-top: 1px;
    }

    .header-actions {
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    /* Key Mode Badge */
    .mode-badge {
      background: rgba(234, 179, 8, 0.15);
      border: 1px solid rgba(234, 179, 8, 0.4);
      color: #facc15;
      padding: 4px 8px;
      border-radius: 10px;
      font-size: 0.68rem;
      font-weight: 700;
      white-space: nowrap;
    }

    /* Fullscreen Toggle Button */
    .fullscreen-btn {
      background-color: rgba(56, 189, 248, 0.15);
      border: 1px solid rgba(56, 189, 248, 0.4);
      color: #38bdf8;
      padding: 4px 10px;
      border-radius: 10px;
      font-size: 0.72rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 4px;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .fullscreen-btn:hover {
      background-color: rgba(56, 189, 248, 0.3);
      border-color: #38bdf8;
    }

    .tonic-badge {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 10px;
      padding: 4px 8px;
      display: flex;
      gap: 4px;
      align-items: center;
      font-family: ui-monospace, monospace;
      white-space: nowrap;
    }
    .tonic-badge .col-left { font-size: 0.65rem; color: #94a3b8; }
    .tonic-badge .col-right { font-size: 0.8rem; font-weight: 700; color: #38bdf8; }

    /* Top Panels Container */
    .top-panels {
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
      flex-shrink: 0;
    }

    /* Control Panel */
    .controls-card {
      background-color: #181b26;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      border: 1px solid #252b3d;
    }
    .control-group {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
    }
    .control-label {
      font-size: 0.65rem;
      font-weight: 700;
      color: #9ca3af;
      letter-spacing: 0.03em;
    }
    .segmented-btn-group {
      display: flex;
      background-color: #0d0f17;
      border-radius: 8px;
      padding: 2px;
      border: 1px solid #232838;
      flex-wrap: wrap;
      gap: 2px;
    }
    .segmented-btn {
      background: none;
      border: none;
      color: #9ca3af;
      padding: 3px 8px;
      font-size: 0.68rem;
      font-weight: 600;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s ease;
      white-space: nowrap;
    }
    .segmented-btn.active {
      background-color: #2563eb;
      color: #ffffff;
    }
    .freq-input {
      background-color: #0d0f17;
      border: 1px solid #232838;
      color: #38bdf8;
      font-family: monospace;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 2px 4px;
      border-radius: 6px;
      width: 58px;
      text-align: right;
    }

    /* Telemetry Display */
    .telemetry-card {
      background-color: #181b26;
      border-radius: 12px;
      padding: 8px 12px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      border: 1px solid #252b3d;
    }
    .tel-item { 
      display: flex; 
      flex-direction: column; 
      min-width: 0; 
      overflow: hidden;
    }
    .tel-label { 
      font-size: 0.58rem; 
      font-weight: 700; 
      color: #6b7280; 
      letter-spacing: 0.04em; 
      white-space: nowrap; 
    }
    .tel-value { 
      font-family: ui-monospace, monospace; 
      font-size: 0.72rem; 
      font-weight: 600; 
      color: #f3f4f6; 
      line-height: 1.25;
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 2.5em;
    }
    .tel-value .line {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }
    .tel-value.highlight { color: #38bdf8; }

    /* Stage Area */
    .stage-card {
      background-color: #181b26;
      border-radius: 14px;
      padding: 10px 8px;
      margin-bottom: 8px;
      border: 1px solid #252b3d;
      flex-grow: 1;
      display: flex;
      align-items: center;
      min-height: 0;
    }
    .tines-container {
      position: relative;
      height: 320px;
      max-height: 100%;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      padding-top: 8px;
      width: 100%;
    }
    .bridge-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 10px;
      background: linear-gradient(180deg, #4a2e1b 0%, #2a180e 100%);
      border-radius: 5px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.6);
      z-index: 1;
    }
    .tine-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 2;
      margin: 0 1px;
      min-width: 0;
      height: 100%;
      justify-content: flex-start;
    }
    .tine {
      width: 100%;
      max-width: 44px;
      min-width: 16px;
      background: linear-gradient(180deg, #4b5263 0%, #2b2f3a 100%);
      border-radius: 0 0 8px 8px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-end;
      padding: 6px 2px 6px;
      transition: height 0.2s ease, background 0.08s ease, transform 0.08s ease;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      user-select: none;
      overflow: hidden;
    }
    .tine-wrapper.is-tonic .tine {
      background: linear-gradient(180deg, #3b82f6 0%, #1d4ed8 100%);
    }
    .tine-wrapper.active .tine {
      background: linear-gradient(180deg, #60a5fa 0%, #2563eb 100%) !important;
      box-shadow: 0 0 16px rgba(59, 130, 246, 0.9) !important;
      transform: translateY(4px);
    }
    .tine-idx {
      font-size: 0.68rem;
      font-weight: 800;
      color: #facc15;
      margin-bottom: 2px;
    }
    .tine-name {
      font-size: 0.52rem;
      font-weight: 700;
      color: #ffffff;
      text-align: center;
      line-height: 1.1;
      word-break: break-word;
      max-width: 100%;
    }
    .tine-ratio-text {
      font-size: 0.60rem;
      font-weight: 700;
      color: #9ca3af;
      margin-top: 4px;
      text-align: center;
      white-space: nowrap;
    }
    .tine-cents-text {
      font-size: 0.52rem;
      color: #6b7280;
      white-space: nowrap;
    }
    .tine-key-shortcut {
      font-size: 0.50rem;
      color: #38bdf8;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      padding: 1px 4px;
      border-radius: 3px;
      margin-top: 2px;
      white-space: nowrap;
      font-family: monospace;
    }
    
    .presets-section {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      flex-shrink: 0;
    }
    .presets-label { font-size: 0.7rem; color: #9ca3af; font-weight: 600; }
    .presets-grid { display: flex; gap: 6px; flex-wrap: wrap; }
    .preset-btn {
      background-color: #181b26;
      border: 1px solid #2e3545;
      color: #e5e7eb;
      padding: 4px 10px;
      border-radius: 14px;
      font-size: 0.68rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .preset-btn:hover { background-color: #262b38; border-color: #4b5563; }
    .preset-btn.active {
      background-color: rgba(37, 99, 235, 0.25);
      border-color: #3b82f6;
      color: #60a5fa;
    }

    /* Landscape & Desktop Responsive Layout */
    @media (orientation: landscape) or (min-width: 768px) {
      .app-card {
        max-width: 1020px;
        padding: 12px 18px;
        max-height: 100vh;
      }

      .header { margin-bottom: 6px; }

      .top-panels {
        display: grid;
        grid-template-columns: 1.1fr 0.9fr;
        gap: 10px;
        margin-bottom: 6px;
      }

      .controls-card, .telemetry-card {
        margin-bottom: 0;
        height: 100%;
        padding: 6px 10px;
      }

      .telemetry-card {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px 8px;
        align-items: center;
      }

      .telemetry-card .control-group {
        grid-column: 1 / -1;
        border-top: 1px solid rgba(255, 255, 255, 0.06);
        padding-top: 4px;
        margin-top: 2px;
      }

      .stage-card {
        padding: 6px;
        margin-bottom: 6px;
      }

      .tines-container {
        height: 220px;
      }
    }

    /* Height-constrained landscape mode */
    @media (orientation: landscape) and (max-height: 580px) {
      body { padding: 0; }
      .app-card { 
        padding: 6px 12px; 
        border-radius: 0;
        border: none;
        height: 100vh;
        max-height: 100vh;
        justify-content: space-between;
      }
      .header { margin-bottom: 4px; }
      .title-group h1 { font-size: 0.92rem; }
      .title-group p { font-size: 0.62rem; }
      .top-panels { margin-bottom: 4px; gap: 6px; }
      .controls-card, .telemetry-card { padding: 4px 8px; gap: 4px; }
      .stage-card { padding: 4px; margin-bottom: 4px; }
      .tines-container { height: 180px; }
      .tine-name { font-size: 0.48rem; }
      .tine-ratio-text { font-size: 0.55rem; margin-top: 2px; }
      .tine-cents-text { font-size: 0.48rem; }
      .tine-key-shortcut { font-size: 0.46rem; margin-top: 1px; }
      .presets-section { gap: 4px; }
      .preset-btn { padding: 2px 8px; font-size: 0.62rem; }
    }
  </style>
</head>
<body>
  <div class="app-card" id="appCard">
    <div class="header">
      <div class="title-group">
        <h1 id="appTitle">Extended Just Intonation Kalimba Synthesizer</h1>
        <p id="appSubtitle">Portrait: 8-Key / Landscape: 13-Key</p>
      </div>
      <div class="header-actions">
        <span class="mode-badge" id="badgeKeyMode">Portrait: 8-Key</span>
        <button class="fullscreen-btn" id="btnFullscreen">
          <span>⛶</span><span id="txtFullscreen">Full</span>
        </button>
        <div class="tonic-badge">
          <div class="col-left"><span>Tonic </span><span>(1/1):</span></div>
          <div class="col-right"><span id="badgeTonicFreq">417.6</span><span>Hz</span></div>
        </div>
      </div>
    </div>

    <div class="top-panels">
      <!-- Controls Panel -->
      <div class="controls-card">
        <div class="control-group">
          <span class="control-label">SCALE SYSTEM</span>
          <div class="segmented-btn-group" id="scaleToggle">
            <button class="segmented-btn active" data-scale="souljazz">7-Limit Soul Jazz Blues Tuning</button>
            <button class="segmented-btn" data-scale="harmonics">23-Limit Natural Harmonics</button>
            <button class="segmented-btn" data-scale="pythagorean">Pythagorean 3-Limit</button>
            <button class="segmented-btn" data-scale="archytas">Archytas's 7-Limit</button>
            <button class="segmented-btn" data-scale="classic5limit">Classic 5-Limit</button>
          </div>
        </div>
        <div class="control-group">
          <span class="control-label">BASE TONIC (1/1)</span>
          <div style="display: flex; gap: 6px; align-items: center;">
            <div class="segmented-btn-group" id="tonicPresetBtns">
              <button class="segmented-btn active" data-freq="417.6">417.6</button>
              <button class="segmented-btn" data-freq="432">432</button>
              <button class="segmented-btn" data-freq="440">440</button>
            </div>
            <input type="number" id="inputCustomFreq" class="freq-input" value="417.6" step="0.1" min="100" max="1000">
            <span style="font-size:0.65rem; color:#6b7280;">Hz</span>
          </div>
        </div>
      </div>

      <!-- Telemetry Card -->
      <div class="telemetry-card">
        <div class="tel-item">
          <span class="tel-label">LAST PLUCKED</span>
          <div class="tel-value" id="valLastPlucked">
            <span class="line">① Unison / Tonic</span>
            <span class="line">(1/1 • 417.60 Hz)</span>
          </div>
        </div>
        <div class="tel-item">
          <span class="tel-label">INTER-NOTE RATIO</span>
          <div class="tel-value highlight" id="valInterval">
            <span class="line">① → ①</span>
            <span class="line">(1/1 • 0.0¢ diff)</span>
          </div>
        </div>
        <div class="control-group">
          <span class="control-label">NOISE FILTER</span>
          <div class="segmented-btn-group" id="noiseFilterToggle">
            <button class="segmented-btn active" data-filter="on">ON (High)</button>
            <button class="segmented-btn" data-filter="off">OFF (Fast)</button>
          </div>
        </div>
      </div>
    </div>

    <div class="stage-card">
      <div class="tines-container" id="tinesWrapper">
        <div class="bridge-bar"></div>
      </div>
    </div>

    <div class="presets-section">
      <span class="presets-label">Chords:</span>
      <div class="presets-grid" id="presetButtons"></div>
    </div>
  </div>

    const vSlot13 = [11, 9, 7, 5, 3, 1, 0, 2, 4, 6, 8, 10, 12];
    const shortcuts8 = ['1', '2', '3', '4', '5', '6', '7', '8'];
    const shortcuts13 = ['1', '2', '3', '4', '5', '6', '7', '8', '9', '0', '-', '=', 'q'];

    let currentScaleKey = 'souljazz';
    let currentTonicFreq = 417.6;
    let is8KeyMode = true;
    let currentTines = [];
    let audioCtx = null, compressor = null, masterGain = null;
    let sharedNoiseBuffer = null;
    let isNoiseFilterEnabled = true;
    let lastTine = null, currentTine = null;

    function gcd(a, b) {
      a = Math.abs(a); b = Math.abs(b);
      while (b) { const t = b; b = a % b; a = t; }
      return a;
    }

    function calcIntervalRatio(tineA, tineB) {
      let num = tineB.num * tineA.den;
      let den = tineB.den * tineA.num;
      const g = gcd(num, den);
      return `${num / g}/${den / g}`;
    }

    function detectKeyMode() {
      const isPortrait = window.innerHeight > window.innerWidth;
      const isNarrow = window.innerWidth < 680;
      return isPortrait || isNarrow;
    }

    function rebuildTinesData() {
      const scaleDef = scalesData[currentScaleKey];
      if (!scaleDef) return;
      is8KeyMode = detectKeyMode();

      const isShortEnv = (window.innerHeight < 580 && !is8KeyMode);

      let baseMaxHeight, heightDiffScale;

      if (isShortEnv) {
        baseMaxHeight = 150;
        heightDiffScale = 45;
      } else if (is8KeyMode) {
        baseMaxHeight = 280;
        heightDiffScale = 85;
      } else {
        baseMaxHeight = 210;
        heightDiffScale = 65;
      }

      if (is8KeyMode) {
        // ピッチ順（セント値昇順）にソートして、低い音から順に ①, ②, ③ ... を自動割り当て
        const sortedPitches = [...scaleDef.keys8].sort((a, b) => a.cents - b.cents);
        
        currentTines = scaleDef.keys8.map((item, idx) => {
          const pitchRank = sortedPitches.findIndex(p => p.cents === item.cents) + 1;
          const ratioVal = item.num / item.den;
          const freq = currentTonicFreq * ratioVal;
          const height = Math.round(baseMaxHeight - (ratioVal - 1) * heightDiffScale);
          return {
            ...item,
            labelNum: numToCircle[pitchRank],
            slotIndex: idx,
            pitchIndex: pitchRank - 1,
            ratioStr: `${item.num}/${item.den}`,
            freq,
            height,
            shortcut: shortcuts8[idx]
          };
        });
      } else {
        const sorted13 = [...scaleDef.keys13].sort((a, b) => a.cents - b.cents);
        const pitchList = scaleDef.keys13.map((item) => {
          const pitchRank = sorted13.findIndex(p => p.cents === item.cents) + 1;
          const ratioVal = item.num / item.den;
          const freq = currentTonicFreq * ratioVal;
          const height = Math.round(baseMaxHeight - (ratioVal - 1) * heightDiffScale);
          return { 
            ...item, 
            labelNum: numToCircle[pitchRank],
            pitchIndex: pitchRank - 1, 
            ratioStr: `${item.num}/${item.den}`, 
            freq, 
            height 
          };
        });

        currentTines = vSlot13.map((pitchIdx, slotIdx) => {
          return {
            ...pitchList[pitchIdx],
            slotIndex: slotIdx,
            keyShortcut: shortcuts13[slotIdx]
          };
        });
      }

      if (!currentTine || !currentTines.some(t => t.num === currentTine.num && t.den === currentTine.den)) {
        currentTine = currentTines.find(t => t.num === 1 && t.den === 1) || currentTines[4] || currentTines[0];
        lastTine = currentTine;
      }
    }

    function initAudio() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContextClass();

        const hpf = audioCtx.createBiquadFilter();
        hpf.type = 'highpass';
        hpf.frequency.setValueAtTime(120, audioCtx.currentTime);

        compressor = audioCtx.createDynamicsCompressor();
        compressor.threshold.setValueAtTime(-12.0, audioCtx.currentTime);
        compressor.knee.setValueAtTime(10, audioCtx.currentTime);
        compressor.ratio.setValueAtTime(6, audioCtx.currentTime);

        masterGain = audioCtx.createGain();
        masterGain.gain.setValueAtTime(0.25, audioCtx.currentTime);

        compressor.connect(hpf);
        hpf.connect(masterGain);
        masterGain.connect(audioCtx.destination);

        const bufferSize = Math.floor(audioCtx.sampleRate * 0.05);
        sharedNoiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = sharedNoiseBuffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
      }
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playTone(freq) {
      initAudio();
      const now = audioCtx.currentTime;
      
      const osc1 = audioCtx.createOscillator(), gain1 = audioCtx.createGain();
      osc1.type = 'sine'; osc1.frequency.setValueAtTime(freq, now);
      gain1.gain.setValueAtTime(0.5, now); gain1.gain.exponentialRampToValueAtTime(0.0001, now + 2.5);
      
      const osc2 = audioCtx.createOscillator(), gain2 = audioCtx.createGain();
      osc2.type = 'sine'; osc2.frequency.setValueAtTime(freq * 2.756, now);
      gain2.gain.setValueAtTime(0.18, now); gain2.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
      
      const noise = audioCtx.createBufferSource();
      noise.buffer = sharedNoiseBuffer;

      const noiseGain = audioCtx.createGain();
      noiseGain.gain.setValueAtTime(0.10, now);
      noiseGain.gain.exponentialRampToValueAtTime(0.001, now + 0.015);

      if (isNoiseFilterEnabled) {
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1400, now);
        noise.connect(filter);
        filter.connect(noiseGain);
      } else {
        noise.connect(noiseGain);
      }
      
      osc1.connect(gain1);
      osc2.connect(gain2);
      gain1.connect(compressor);
      gain2.connect(compressor);
      noiseGain.connect(compressor);

      osc1.start(now); osc2.start(now); noise.start(now);
      osc1.stop(now + 2.6); osc2.stop(now + 0.3); noise.stop(now + 0.015);
    }

    const tinesWrapper = document.getElementById('tinesWrapper');
    const presetButtons = document.getElementById('presetButtons');
    const valLastPlucked = document.getElementById('valLastPlucked');
    const valInterval = document.getElementById('valInterval');

    function triggerTine(tineObj) {
      playTone(tineObj.freq);
      if (currentTine.slotIndex !== tineObj.slotIndex) {
        lastTine = currentTine;
        currentTine = tineObj;
      }
      
      valLastPlucked.innerHTML = `
        <span class="line">${tineObj.labelNum} ${tineObj.name}</span>
        <span class="line">(${tineObj.ratioStr} • ${tineObj.freq.toFixed(2)} Hz)</span>
      `;
      
      const interRatio = calcIntervalRatio(lastTine, currentTine);
      const diffCents = Math.abs(currentTine.cents - lastTine.cents).toFixed(1);
      valInterval.innerHTML = `
        <span class="line">${lastTine.labelNum} → ${currentTine.labelNum}</span>
        <span class="line">(${interRatio} • ${diffCents}¢ diff)</span>
      `;

      const el = document.querySelector(`.tine-wrapper[data-slot-index="${tineObj.slotIndex}"]`);
      if (el) { el.classList.add('active'); setTimeout(() => el.classList.remove('active'), 150); }
    }

    function renderApp() {
      rebuildTinesData();
      
      const scaleDef = scalesData[currentScaleKey];
      document.getElementById('badgeKeyMode').textContent = is8KeyMode ? 'Portrait: 8-Key' : 'Landscape: 13-Key';
      document.getElementById('badgeTonicFreq').textContent = currentTonicFreq.toFixed(1);

      tinesWrapper.innerHTML = '<div class="bridge-bar"></div>';
      currentTines.forEach(tine => {
        const wrapper = document.createElement('div');
        wrapper.className = `tine-wrapper ${tine.num === 1 && tine.den === 1 ? 'is-tonic' : ''}`;
        wrapper.dataset.slotIndex = tine.slotIndex;
        wrapper.innerHTML = `
          <div class="tine" style="height: ${tine.height}px;">
            <span class="tine-idx">${tine.labelNum}</span>
            <span class="tine-name">${tine.name}</span>
          </div>
          <span class="tine-ratio-text">${tine.ratioStr}</span>
          <span class="tine-cents-text">${tine.cents.toFixed(0)}¢</span>
          <span class="tine-key-shortcut" title="PC Keyboard Shortcut">${tine.shortcut || tine.keyShortcut}</span>
        `;
        const onPluck = (e) => { e.preventDefault(); triggerTine(tine); };
        wrapper.addEventListener('mousedown', onPluck);
        wrapper.addEventListener('touchstart', onPluck);
        tinesWrapper.appendChild(wrapper);
      });

      presetButtons.innerHTML = '';
      const activeChords = is8KeyMode ? scaleDef.chords8 : scaleDef.chords13;
      activeChords.forEach((c, idx) => {
        const btn = document.createElement('button');
        btn.className = `preset-btn ${idx === 0 ? 'active' : ''}`;
        btn.textContent = c.label;
        btn.addEventListener('click', () => {
          document.querySelectorAll('.preset-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          
          if (is8KeyMode) {
            c.slotIndices.forEach((sIdx, delay) => {
              const targetTine = currentTines[sIdx];
              if (targetTine) setTimeout(() => triggerTine(targetTine), delay * 80);
            });
          } else {
            c.pitchIndices.forEach((pIdx, delay) => {
              const targetTine = currentTines.find(t => t.pitchIndex === pIdx);
              if (targetTine) setTimeout(() => triggerTine(targetTine), delay * 60);
            });
          }
        });
        presetButtons.appendChild(btn);
      });
    }

    const btnFullscreen = document.getElementById('btnFullscreen');
    const txtFullscreen = document.getElementById('txtFullscreen');
    const appCard = document.getElementById('appCard');

    function toggleFullscreen() {
      if (!document.fullscreenElement && !document.webkitFullscreenElement) {
        if (appCard.requestFullscreen) appCard.requestFullscreen();
        else if (appCard.webkitRequestFullscreen) appCard.webkitRequestFullscreen();
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
        else if (document.webkitExitFullscreen) document.webkitExitFullscreen();
      }
    }

    btnFullscreen.addEventListener('click', toggleFullscreen);

    function updateFullscreenUI() {
      const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement);
      txtFullscreen.textContent = isFS ? 'Exit FS' : 'Fullscreen';
      setTimeout(renderApp, 100);
    }

    document.addEventListener('fullscreenchange', updateFullscreenUI);
    document.addEventListener('webkitfullscreenchange', updateFullscreenUI);

    window.addEventListener('resize', () => {
      renderApp();
    });

    document.getElementById('scaleToggle').addEventListener('click', (e) => {
      const btn = e.target.closest('.segmented-btn'); if (!btn) return;
      document.querySelectorAll('#scaleToggle .segmented-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentScaleKey = btn.dataset.scale;
      renderApp();
    });

    document.getElementById('noiseFilterToggle').addEventListener('click', (e) => {
      const btn = e.target.closest('.segmented-btn'); if (!btn) return;
      document.querySelectorAll('#noiseFilterToggle .segmented-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      isNoiseFilterEnabled = (btn.dataset.filter === 'on');
    });

    document.getElementById('tonicPresetBtns').addEventListener('click', (e) => {
      const btn = e.target.closest('.segmented-btn'); if (!btn) return;
      document.querySelectorAll('#tonicPresetBtns .segmented-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentTonicFreq = parseFloat(btn.dataset.freq);
      document.getElementById('inputCustomFreq').value = currentTonicFreq;
      renderApp();
    });

    document.getElementById('inputCustomFreq').addEventListener('input', (e) => {
      const val = parseFloat(e.target.value);
      if (val && val >= 100 && val <= 1000) {
        currentTonicFreq = val;
        document.querySelectorAll('#tonicPresetBtns .segmented-btn').forEach(b => {
          b.classList.toggle('active', parseFloat(b.dataset.freq) === currentTonicFreq);
        });
        renderApp();
      }
    });

    window.addEventListener('keydown', (e) => {
      const pressedKey = e.key.toLowerCase();
      const match = currentTines.find(t => (t.shortcut || t.keyShortcut) === pressedKey);
      if (match) triggerTine(match);
    });

    renderApp();
